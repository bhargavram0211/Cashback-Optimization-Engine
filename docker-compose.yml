version: '3.8'

services:
  db:
    image: postgres:16
    platform: linux/arm64
    container_name: cashback_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: cashback_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID}
      PLAID_SECRET: ${PLAID_SECRET}
      PLAID_ENV: ${PLAID_ENV}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
      - ./backend/scripts:/app/scripts

  # Streamlit frontend (commented out during migration to React)
  # Uncomment if you need to test the old Streamlit frontend
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   platform: linux/arm64
  #   container_name: cashback_frontend
  #   environment:
  #     BACKEND_URL: http://backend:8000
  #   ports:
  #     - "8501:8501"
  #   depends_on:
  #     - backend
  #   volumes:
  #     - ./frontend:/app
  #   restart: unless-stopped

  frontend-js:
    build:
      context: ./frontend-js
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: cashback_frontend_js
    environment:
      VITE_BACKEND_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend-js:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  postgres_data:

